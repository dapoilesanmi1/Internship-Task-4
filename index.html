<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban Lite Fiyinfoluwa's IT Board</title>
  <meta name="description" content="A responsive Kanban-style task board built with plain HTML, CSS and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('kanbanLite.theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">
      <h1>Kanban Lite</h1>
      <p id="taskCounter" class="counter" aria-live="polite">0 active · 0 completed</p>
    </div>
    <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false">
      <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
      <span id="themeLabel">Dark mode</span>
    </button>
  </header>

  <main class="layout">
    <!-- ADD TASK FORM -->
    <section class="panel" aria-labelledby="addHeading">
      <h2 id="addHeading">Add a task</h2>
      <form id="taskForm" class="form" novalidate>
        <label class="field">
          <span>Title</span>
          <input type="text" id="titleInput" maxlength="80" placeholder="e.g. Fix login bug" required>
          <small class="field__error" id="titleError" hidden>Please give the task a title.</small>
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="descInput" rows="3" maxlength="300" placeholder="Optional details"></textarea>
        </label>

        <div class="form__row">
          <label class="field">
            <span>Category</span>
            <select id="categoryInput">
              <option>Development</option>
              <option>Design</option>
              <option>Marketing</option>
              <option>Other</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="priorityInput">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>

        <button type="submit" class="btn btn--primary">Add task</button>
      </form>

      <!-- FILTERS -->
      <div class="filters">
        <h2>Find tasks</h2>
        <label class="field">
          <span>Search by title</span>
          <input type="search" id="searchInput" placeholder="Type to filter…">
        </label>
        <label class="field">
          <span>Category</span>
          <select id="filterCategory">
            <option value="all">All categories</option>
            <option>Development</option>
            <option>Design</option>
            <option>Marketing</option>
            <option>Other</option>
          </select>
        </label>
      </div>
    </section>

    <!-- BOARD -->
    <section class="board" aria-label="Task board">

      <div class="column" data-status="todo">
        <header class="column__head">
          <h2>To Do</h2>
          <span class="column__count" data-count="todo">0</span>
        </header>
        <ul class="column__list" id="list-todo"></ul>
      </div>

      <div class="column" data-status="progress">
        <header class="column__head">
          <h2>In Progress</h2>
          <span class="column__count" data-count="progress">0</span>
        </header>
        <ul class="column__list" id="list-progress"></ul>
      </div>

      <div class="column" data-status="done">
        <header class="column__head">
          <h2>Completed</h2>
          <span class="column__count" data-count="done">0</span>
        </header>
        <ul class="column__list" id="list-done"></ul>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
